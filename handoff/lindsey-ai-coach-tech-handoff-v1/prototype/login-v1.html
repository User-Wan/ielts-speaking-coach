<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录｜Lindsey 的 AI 提分教练</title>
  <style>
    :root{--w:1440px;--h:900px;--purple:#6650dd;--ink:#29243b;--muted:#827b91;--line:#e7e3ef}*{box-sizing:border-box}body{margin:0;background:#e8e7ef;color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif}.workspace{width:max-content;margin:28px auto}#artboard{width:var(--w);height:var(--h);display:grid;grid-template-columns:1.07fr .93fr;overflow:hidden;background:#fff}.intro{position:relative;padding:72px 112px;overflow:hidden;color:#fff;background:linear-gradient(145deg,#382b78,#654ede)}.intro:after{content:"";position:absolute;right:-140px;bottom:-170px;width:490px;height:490px;border:70px solid #ffffff12;border-radius:50%}.brand{position:relative;z-index:1;display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#fff;color:#392b7a;font-weight:900}.brand b{font-size:16px}.brand small{display:block;margin-top:3px;color:#d4ceff;font-size:11px}.intro-copy{position:relative;z-index:1;margin-top:152px;max-width:505px}.eyebrow{color:#d8d0ff;font-size:12px;font-weight:900;letter-spacing:.12em}.intro h1{margin:17px 0;font-size:43px;line-height:1.25;letter-spacing:-1.5px}.intro p{color:#e2ddff;font-size:16px;line-height:1.8}.promise{position:relative;z-index:1;margin-top:42px;padding:17px 19px;border:1px solid #ffffff2c;border-radius:16px;background:#ffffff12;color:#f5f3ff;font-size:13px;line-height:1.7}.login{display:flex;align-items:center;justify-content:center;padding:72px}.card{width:395px}.card h2{margin:0;font-size:28px;letter-spacing:-1px}.sub{margin:10px 0 31px;color:var(--muted);font-size:14px;line-height:1.65}.mode{display:flex;margin-bottom:24px;border-bottom:1px solid var(--line)}.mode button{flex:1;padding:10px;border:0;border-bottom:2px solid transparent;background:transparent;color:#8d8799;font:inherit;font-size:13px;cursor:pointer}.mode button.active{border-color:var(--purple);color:#5d48cf;font-weight:900}.field{margin:13px 0}.field label{display:block;margin-bottom:8px;color:#5c5668;font-size:12px;font-weight:900}.field input{width:100%;padding:14px 15px;border:1px solid #ded9e9;border-radius:12px;color:var(--ink);font:inherit;font-size:14px;outline:none}.field input:focus{border-color:#7965e8;box-shadow:0 0 0 3px #735ee916}.code{display:flex;gap:9px}.code input{flex:1}.send{padding:0 14px;border:1px solid #dcd6ee;border-radius:12px;background:#fff;color:#5f4acd;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.primary{width:100%;margin-top:10px;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#755eea,#5641cc);color:#fff;font:inherit;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 13px 24px #5d48d629}.or{display:flex;align-items:center;gap:11px;margin:23px 0;color:#a19aaa;font-size:11px}.or:before,.or:after{content:"";height:1px;flex:1;background:var(--line)}.wechat{width:100%;padding:14px;border:1px solid #ded9e9;border-radius:13px;background:#fff;color:#373143;font:inherit;font-size:14px;font-weight:900;cursor:pointer}.wechat i{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:7px;border-radius:50%;background:#36c46d;color:#fff;font-style:normal;font-size:10px}.terms{margin-top:17px;color:#aaa3b2;font-size:11px;line-height:1.6;text-align:center}.terms a{color:#705be1;text-decoration:none}.back{display:inline-block;margin-bottom:43px;color:#786fd0;font-size:12px;font-weight:900;text-decoration:none}.export-controls{display:flex;justify-content:center;margin:18px}.export-button{border:0;border-radius:99px;padding:12px 20px;background:#2744b9;color:#fff;font-weight:800;cursor:pointer}.export-status{text-align:center;color:#566078;font-size:12px}
  </style>
</head>
<body>
  <main class="workspace"><section id="artboard">
    <section class="intro"><div class="brand"><div class="logo">L+</div><div><b>Lindsey 的 AI 提分教练</b><small>IELTS speaking practice</small></div></div><div class="intro-copy"><div class="eyebrow">YOUR PRACTICE, REMEMBERED</div><h1>不是重新开始。<br>每一次开口，都会被记得。</h1><p>登录后，AI 教练会保存你的课程、课时、练习进度和自动复习安排。下一次回来，直接从上次练到的地方继续。</p><div class="promise">你的学习档案只服务于你的训练：课时、训练记录、复习进度和你主动保存的内容，都由你自己管理。</div></div></section>
    <section class="login"><div class="card"><a class="back" href="product-home-v1.html">← 返回产品主页</a><h2>登录后，开始你的试课</h2><p class="sub">本机测试版：填写测试手机号或邮箱与任意验证码，即可创建只保存在当前浏览器里的学习档案。</p><div class="mode"><button class="active" type="button">手机号登录</button><button type="button" id="email-mode">邮箱登录</button></div><div class="field"><label id="account-label">手机号</label><input id="account" placeholder="请输入测试手机号" inputmode="tel"></div><div class="field"><label>验证码</label><div class="code"><input id="code" placeholder="请输入任意验证码" inputmode="numeric"><button class="send" id="send-code" type="button">获取验证码</button></div></div><button class="primary" id="login-button" type="button">登录并免费试一节课 →</button><div class="or">或</div><button class="wechat" id="wechat" type="button"><i>微</i>微信一键登录</button><p class="terms">本机测试数据不会上传服务器；清除浏览器数据后会消失。</p></div></section>
  </section><div id="export-controls" class="export-controls"><div><button id="export-png" class="export-button">⇩ 导出 PNG</button><p id="export-status" class="export-status"></p></div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const account=document.getElementById('account'), label=document.getElementById('account-label');
    document.getElementById('email-mode').onclick=()=>{label.textContent='邮箱';account.placeholder='请输入邮箱';account.inputMode='email';};
    document.getElementById('send-code').onclick=()=>{document.getElementById('send-code').textContent='验证码已发送';};
    function enterDemo(accountValue, method){
      const profile={account:accountValue,method,createdAt:new Date().toISOString(),plan:'30 课时稳定表达包',remaining:28,total:30};
      localStorage.setItem('lindsey-ai-coach-demo-profile',JSON.stringify(profile));
      document.getElementById('login-button').textContent='正在进入我的 AI 教练…';
      setTimeout(()=>location.href='my-coach-dashboard-v4.html',400);
    }
    document.getElementById('login-button').onclick=()=>{const value=account.value.trim(), code=document.getElementById('code').value.trim();if(!value||!code){document.querySelector('.sub').textContent='本机测试版：填写手机号（或邮箱）和任意验证码，即可创建本地学习档案。';return;}enterDemo(value,label.textContent);};
    document.getElementById('wechat').onclick=()=>enterDemo('微信体验用户','微信一键登录（演示）');
    const b=document.getElementById('export-png'),a=document.getElementById('artboard'),s=document.getElementById('export-status');b.onclick=async()=>{b.disabled=true;s.textContent='正在生成 PNG…';try{await document.fonts.ready;const c=await html2canvas(a,{scale:1,backgroundColor:null,width:a.offsetWidth,height:a.offsetHeight,windowWidth:a.offsetWidth,windowHeight:a.offsetHeight,useCORS:true});const l=document.createElement('a');l.download='lindsey-ai-coach-login-v1.png';l.href=c.toDataURL('image/png');l.click();s.textContent=`已导出 ${c.width} × ${c.height} PNG`;}catch(e){s.textContent='导出失败：'+e.message}finally{b.disabled=false}};
  </script>
</body>
</html>
