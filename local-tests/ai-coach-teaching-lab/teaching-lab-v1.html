<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 教练教学调试房</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f0f5;color:#29233c;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.app{width:min(1160px,calc(100% - 48px));min-height:100vh;margin:auto;padding:30px 0 54px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.brand{font-size:16px;font-weight:900}.brand small{display:block;margin-top:5px;color:#888195;font-size:11px;font-weight:400}.tag{padding:7px 10px;border-radius:9px;background:#e8e4fb;color:#624dcc;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{border:1px solid #e4e0ea;border-radius:18px;background:#fff;box-shadow:0 7px 20px #2d25550b}.context{padding:21px}.context h2,.room h2{margin:0;font-size:16px}.context p{margin:8px 0 17px;color:#827c8e;font-size:12px;line-height:1.6}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;color:#625b6d;font-size:11px;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd8e8;border-radius:10px;padding:10px;color:#352e43;font:inherit;font-size:12px;outline:none}.field textarea{min-height:102px;line-height:1.55;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7964e5;box-shadow:0 0 0 3px #745ee415}.note{padding:12px;border-radius:12px;background:#f6f4fc;color:#766e86;font-size:11px;line-height:1.65}.room{display:flex;min-height:650px;flex-direction:column;padding:23px}.room-head{display:flex;align-items:flex-start;justify-content:space-between}.room h2{font-size:18px}.room-head p{margin:7px 0 0;color:#837d90;font-size:12px}.status{padding:8px 10px;border-radius:9px;background:#f3f1ff;color:#624ccc;font-size:11px;font-weight:900}.messages{flex:1;margin-top:21px;overflow:auto;padding:4px 4px 18px}.bubble{max-width:76%;margin:13px 0;padding:14px 16px;border-radius:16px 16px 16px 4px;background:#f1eff7;font-size:13px;line-height:1.65}.bubble .who{display:block;margin-bottom:4px;color:#7465d8;font-size:10px;font-weight:900}.bubble.user{margin-left:auto;border-radius:16px 16px 4px 16px;background:#caff8e}.bubble.user .who{color:#527e26}.empty{margin-top:85px;color:#9a94a6;text-align:center;font-size:13px}.composer{border-top:1px solid #eeeaf3;padding-top:16px}.composer label{display:block;margin-bottom:8px;color:#615a6c;font-size:11px;font-weight:900}.sendrow{display:flex;gap:10px}.sendrow textarea{min-height:70px;flex:1;border:1px solid #ddd8e8;border-radius:12px;padding:11px;font:inherit;font-size:13px;line-height:1.55;resize:none}.sendrow button{width:108px;border:0;border-radius:12px;background:#6a55d9;color:#fff;font:inherit;font-size:13px;font-weight:900;cursor:pointer}.sendrow button:disabled{opacity:.6}.error{margin-top:10px;color:#bf465b;font-size:12px}.rules{margin-top:16px;color:#837c90;font-size:11px}.rules code{color:#624ccc}
</style><body><main class="app"><header class="top"><div class="brand">Lindsey 的 AI 提分教练<small>内部教学调试房 · 不会保存真实学生数据</small></div><div class="tag">文字模型测试</div></header><div class="grid"><aside class="panel context"><h2>本题教案</h2><p>你可以在这里改题型、完成标准和当前教学步骤，再模拟学生回答。</p><div class="field"><label>题型</label><select id="part"><option>Part 1</option><option>Part 2</option><option selected>Part 3</option></select></div><div class="field"><label>题目</label><textarea id="question">Why do people prefer living in big cities?</textarea></div><div class="field"><label>高分答案</label><textarea id="answer">Many people prefer living in big cities because they offer more career opportunities. Besides, daily life is often much more convenient, with better transport, healthcare and entertainment.</textarea></div><div class="field"><label>本节完成标准</label><textarea id="standard">无提示地完成观点与展开，并用自己的话说明理由。</textarea></div><div class="field"><label>当前教学步骤</label><select id="step"><option>先听示范，理解回答任务</option><option>看完整语料表达</option><option>看关键词复述</option><option>换成自己的内容</option><option>无提示完整表达</option></select></div><div class="note">这里是教练的“隐藏教案”。学生正式上课时不会看到这些控制项。</div></aside><section class="panel room"><div class="room-head"><div><h2>真实模型对话测试</h2><p>像学生一样输入刚刚说的话，观察 AI 的下一句是否符合你的教学判断。</p></div><div class="status" id="status">等待测试</div></div><div class="messages" id="messages"><div class="empty">请先输入一段模拟学生回答。</div></div><div class="composer"><label for="student">学生刚刚说的话</label><div class="sendrow"><textarea id="student" placeholder="例如：I think people like big cities because there are more jobs..."></textarea><button id="send">发送给 AI 教练</button></div><div class="error" id="error"></div><div class="rules">教学规则文件：<code>teaching-rules-v1.md</code>。改完保存后，下一轮测试立即生效。</div></div></section></div></main><script>
const $=id=>document.getElementById(id);let history=[];const getCourse=()=>({part:$('part').value,question:$('question').value,highScoreAnswer:$('answer').value,completionStandard:$('standard').value,currentStep:$('step').value});function bubble(who,text,user=false){const d=document.createElement('div');d.className='bubble'+(user?' user':'');d.innerHTML='<span class="who">'+who+'</span>'+text.replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\n','<br>');$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}async function send(){const text=$('student').value.trim();if(!text)return;$('error').textContent='';$('messages').querySelector('.empty')?.remove();bubble('模拟学生',text,true);history.push({role:'student',text});$('student').value='';$('send').disabled=true;$('send').textContent='AI 正在判断…';$('status').textContent='AI 正在回应';try{const r=await fetch('/api/coach',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({studentText:text,course:getCourse(),history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求失败');bubble('LINDSEY 的 AI 教练',data.reply);history.push({role:'coach',text:data.reply});$('status').textContent='等待学生继续说'}catch(e){$('error').textContent=e.message||'连接失败';$('status').textContent='等待测试'}finally{$('send').disabled=false;$('send').textContent='发送给 AI 教练'}}$('send').onclick=send;$('student').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')send()});
</script></body></html>
