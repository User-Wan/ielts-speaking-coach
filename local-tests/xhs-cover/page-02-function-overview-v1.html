<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小红书第2页｜功能总览｜V1</title>
  <style>
    :root {
      --artboard-width: 1242px;
      --artboard-height: 1660px;
      --page-bg: #e7e7eb;
      --paper: #f5f5f7;
      --surface: #ffffff;
      --ink: #18181b;
      --muted: #6f6f77;
      --line: #dedee5;
      --purple: #5547b5;
      --purple-soft: #eeebff;
      --blue: #3272de;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--page-bg);
      color: var(--ink);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .workspace { width: max-content; margin: 38px auto 64px; }
    .artboard {
      position: relative;
      width: var(--artboard-width);
      height: var(--artboard-height);
      overflow: hidden;
      padding: 52px 72px 48px;
      background: var(--paper);
      isolation: isolate;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--line);
      color: var(--purple);
      font-size: 16px;
      font-weight: 850;
      letter-spacing: .14em;
    }
    .eyebrow span:last-child {
      color: #8c8c94;
      font-family: ui-monospace, Consolas, monospace;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .title-block { margin-top: 32px; }
    h1 {
      width: 100%;
      margin: 0;
      font-size: 66px;
      line-height: 1.12;
      letter-spacing: -.02em;
      font-weight: 880;
    }
    h1 .title-line { display: block; white-space: nowrap; }
    h1 .accent { color: var(--purple); }
    .lead {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 24px;
      line-height: 1.42;
      font-weight: 650;
    }
    .lead span { display: block; }

    .pain-section {
      display: grid;
      grid-template-columns: 246px 1fr;
      gap: 34px;
      align-items: stretch;
      margin-top: 27px;
      padding: 24px 0;
      border-top: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
    }
    .pain-intro {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 0;
    }
    .section-kicker {
      color: var(--purple);
      font-size: 15px;
      font-weight: 850;
      letter-spacing: .12em;
    }
    .pain-intro strong {
      font-size: 32px;
      line-height: 1.26;
      letter-spacing: -.015em;
    }
    .pain-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
    }
    .pain-item {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 86px;
      padding: 13px 18px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1.5px #e5e4eb;
      font-size: 22px;
      line-height: 1.34;
      font-weight: 760;
    }
    .pain-item b {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--purple-soft);
      color: var(--purple);
      font: 850 16px/1 ui-monospace, Consolas, monospace;
    }

    .product-section { margin-top: 30px; }
    .product-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .product-heading h2 {
      margin: 6px 0 0;
      font-size: 35px;
      line-height: 1.2;
      letter-spacing: -.015em;
    }
    .product-heading p {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 650;
    }
    .screenshot-frame {
      height: 690px;
      margin: 0;
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 24px 55px rgba(40, 37, 66, .16);
    }
    .screenshot-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .page-no {
      position: absolute;
      right: 72px;
      bottom: 23px;
      color: #92929a;
      font: 750 15px/1 ui-monospace, Consolas, monospace;
      letter-spacing: .12em;
    }

    .export-controls { display: flex; justify-content: center; margin-top: 22px; }
    .export-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      background: var(--blue);
      color: #fff;
      font: 800 16px/1 Inter, "Microsoft YaHei", sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(50, 114, 222, .24);
    }
    .export-button:disabled { cursor: wait; opacity: .65; }
    .export-status { min-height: 20px; margin: 10px 0 0; color: #4d4d55; text-align: center; font-size: 13px; }
    body.render-mode { overflow: hidden; background: transparent; }
    body.render-mode .workspace { margin: 0; }
    body.render-mode .export-controls { display: none; }
  </style>
</head>
<body>
  <main class="workspace">
    <section id="artboard" class="artboard" aria-label="小红书第2页功能总览画布">
      <div class="eyebrow"><span>WHY I BUILT IT · FUNCTION OVERVIEW</span><span>IELTS SPEAKING COACH</span></div>

      <header class="title-block">
        <h1>
          <span class="title-line">直接用 ChatGPT Voice</span>
          <span class="title-line">练雅思口语，</span>
          <span class="title-line accent">麻烦的不只是开口</span>
        </h1>
        <p class="lead">
          <span>选题、提示词、复盘和整理，</span>
          <span>都要学习者自己接起来。</span>
        </p>
      </header>

      <section class="pain-section" aria-label="直接使用 ChatGPT Voice 的练习痛点">
        <div class="pain-intro">
          <span class="section-kicker">RAW CHATGPT VOICE</span>
          <strong>每次练习前后，<br />还有四件事</strong>
        </div>
        <div class="pain-grid">
          <div class="pain-item"><b>01</b><span>自己规划练什么</span></div>
          <div class="pain-item"><b>02</b><span>每次重输提示词</span></div>
          <div class="pain-item"><b>03</b><span>手动整理、反复翻找<br />聊天记录</span></div>
          <div class="pain-item"><b>04</b><span>还得用手机另录，<br />才能回听自己的回答</span></div>
        </div>
      </section>

      <section class="product-section" aria-label="IELTS Speaking Coach 首页截图">
        <div class="product-heading">
          <div>
            <span class="section-kicker">ONE DESKTOP WORKFLOW</span>
            <h2>所以，我把练习前后收进一个工具</h2>
          </div>
          <p>首页 · 练习入口与学习状态</p>
        </div>
        <figure class="screenshot-frame">
          <img src="../xhs-feature-screenshots/output/01-training-home.png" alt="IELTS Speaking Coach 首页真实演示截图" />
        </figure>
      </section>

      <div class="page-no">02 / FUNCTION OVERVIEW</div>
    </section>

    <div id="export-controls" class="export-controls">
      <div>
        <button id="export-png" class="export-button" type="button">⇩ 导出 PNG</button>
        <p id="export-status" class="export-status" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('render') === '1') {
      document.body.classList.add('render-mode');
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      window.scrollTo(0, 0);
    }

    const button = document.getElementById('export-png');
    const status = document.getElementById('export-status');
    const artboard = document.getElementById('artboard');

    async function waitForImages(root) {
      const images = [...root.querySelectorAll('img')];
      await Promise.all(images.map((img) => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise((resolve, reject) => {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', () => reject(new Error(`图片加载失败：${img.src}`)), { once: true });
        });
      }));
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = '正在生成 PNG…';
      try {
        if (!window.html2canvas) throw new Error('PNG 导出组件未加载，请联网后刷新页面');
        await document.fonts.ready;
        await waitForImages(artboard);
        const canvas = await html2canvas(artboard, {
          backgroundColor: null,
          scale: 1,
          useCORS: true,
          logging: false,
          width: 1242,
          height: 1660,
          windowWidth: 1242,
          windowHeight: 1660
        });
        const link = document.createElement('a');
        link.download = 'xhs-page-02-function-overview-v1.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        status.textContent = `已导出 ${canvas.width} × ${canvas.height} PNG`;
      } catch (error) {
        status.textContent = `导出失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
