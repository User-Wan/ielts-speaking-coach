name: Deploy public demo

on:
  push:
    branches: [main]
    paths:
      - "demo/dashboard.html"
      - "demo/sample-data.json"
      - "scripts/build-public-demo.mjs"
      - ".github/workflows/deploy-pages.yml"
      - "README.md"
      - "README.zh-CN.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static public demo
        run: node scripts/build-public-demo.mjs

      - name: Verify static public demo
        run: |
          test -s _site/index.html
          test -s _site/sample-data.json
          test -f _site/.nojekyll
          ! grep -Eiq 'state\.json|C:\\Users|E:\\|chatgpt\.com' _site/index.html _site/sample-data.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
